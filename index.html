<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7a4a21">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>小陈学棋</title>
<style>body{font-family:sans-serif;background:#f0d9a0;color:#7a4a21;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}</style>
</head>
<body>
<div>
  <img src="./icon-192.png" width="96" height="96" alt="">
  <h1>小陈学棋</h1>
  <p>PWA 安装测试页</p>
  <p id="st">SW 注册中…</p>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(() => document.getElementById('st').textContent = 'SW 已注册')
    .catch(e => document.getElementById('st').textContent = 'SW 失败: ' + e);
} else {
  document.getElementById('st').textContent = '不支持 SW';
}
</script>
</body>
</html>
